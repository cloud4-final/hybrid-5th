name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'infra/aws/**'
            scripts:
              - 'scripts/**'
              - 'infra/aws/userdata/**'
              - '**/*.sh'

  lint-scripts:
    name: Lint Shell Scripts
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          check_together: 'yes'
          scandir: '.'

  lint-terraform:
    name: Lint & Validate AWS Terraform
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Init (Validation only, no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Quality Gate: 모노레포의 모든 조건부 Job 결과를 종합하여 PR 필수 상태 체크(Required Status Check)로 활용
  ci-gate:
    name: CI Quality Gate
    needs: [detect-changes, lint-scripts, lint-terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Job Results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "=== CI Job Status Summary ==="
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          FAILED_JOBS=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key)(\(.value.result))"' | tr '\n' ' ' | xargs)

          if [ -n "$FAILED_JOBS" ]; then
            echo "❌ CI Quality Gate Failed! Failed jobs: $FAILED_JOBS"
            exit 1
          fi

          echo "✅ All checks passed or safely skipped."
